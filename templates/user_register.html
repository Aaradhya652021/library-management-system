{% extends "base.html" %}
{% block title %}User Register{% endblock %}
{% block content %}
<h1>User Registration</h1>
<div class="card" style="max-width: 380px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="phone_no">Phone</label>
    <input id="phone_no" name="phone_no" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="required" required>
    <p><button type="submit">Register</button></p>
    <p class="muted">Already have an account? <a href="{{ url_for('user_login') }}">Login here</a></p>
  </form>
</div>
{% endblock %}
