{% extends "base.html" %}
{% block title %}{{ 'Edit member' if mode == 'edit' else 'Add member' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit member' if mode == 'edit' else 'Add member' }}</h1>
<div class="card" style="max-width: 460px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ user.get('name', '') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ user.get('email', '') }}" required>
    <label for="phone_no">Phone</label>
    <input id="phone_no" name="phone_no" value="{{ user.get('phone_no', '') }}" required>
    <p>
      <button type="submit">Save</button>
      <a class="btn ghost" href="{{ url_for('users') }}">Cancel</a>
    </p>
  </form>
</div>
{% endblock %}
